name: Profile Markdown CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Profile Markdown & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Markdown Integrity & Privacy
        run: |
          python -c "
          import re, sys
          content = open('README.md', 'r', encoding='utf-8').read()
          headings = re.findall(r'^#+\s+(.+)$', content, re.MULTILINE)
          print(f'Found {len(headings)} section headings.')
          assert len(headings) >= 5, 'Too few headings found.'
          assert 'AIza' not in content, 'Potential secret pattern detected'
          assert 'ghp_' not in content, 'Potential token pattern detected'
          assert 'github_pat_' not in content, 'Potential token pattern detected'
          print('Profile README integrity and privacy verification passed successfully.')
          "
