8" font-size="12">Services</text><text x="94" y="119" fill="#c8cce8" font-size="12">Security · CI</text></g><circle cx="145" cy="137" r="5" fill="#d3c9ff"><animate attributeName="cx" values="145;1050;145" dur="8s" repeatCount="indefinite"/></circle><text x="34" y="245" fill="#aebbe0" font-size="12">A practical learning path: understand the electrical signal, control it in firmware, transport it, then interpret it responsibly.</text></g></svg>