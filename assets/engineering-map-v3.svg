<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-labelledby="title desc"><title id="title">Engineering system map</title><desc id="desc">A five-stage pathway from physical hardware to firmware, connectivity, edge intelligence and cloud services.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b3b"/><stop offset="1" stop-color="#202d55"/></linearGradient><linearGradient id="ln"><stop stop-color="#b5a7ff"/><stop offset="1" stop-color="#6bdfff"/></linearGradient></defs><rect width="1200" height="276" rx="22" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="32" y="37" fill="#bdb2ff" font-size="12" font-weight="700" letter-spacing="2.2">THE SYSTEM PATH / FROM PHYSICAL SIGNAL TO USEFUL INSIGHT</text><path d="M145 137H1050" fill="none" stroke="url(#ln)" stroke-width="2" stroke-opacity=".65"/><path d="M145 137H1050" fill="none" stroke="#b9b0ff" stroke-width="2" stroke-dasharray="5 12"><animate attributeName="stroke-dashoffset" values="0;-68" dur="4.8s" repeatCount="indefinite"/></path><g transform="translate(35 64)"><rect width="200" height="143" rx="16" fill="#272950" stroke="#a99cff"/><text x="18" y="29" fill="#cbbfff" font-size="12" font-weight="700">01 / PHYSICAL</text><g transform="translate(20 47)" stroke="#9edfff" fill="none" stroke-width="2"><rect x="12" y="4" width="48" height="42" rx="6"/><path d="M0 12H12M0 24H12M0 36H12M60 12H72M60 24H72M60 36H72M26 0V4M46 0V4M26 46V52M46 46V52"/></g><text x="106" y="78" fill="#fff" font-size="18" font-weight="700">Hardware</text><text x="106" y="101" fill="#c8cce8" font-size="12">MCUs · Sensors</text><text x="106" y="119" fill="#c8cce8" font-size="12">Signals · Power</text></g><g transform="translate(275 64)"><rect width="200" height="143" rx="16" fill="#272950" stroke="#a99cff"/><text x="18" y="29" fill="#cbbfff" font-size="12" font-weight="700">02 / CONTROL</text><g transform="translate(19 49)" fill="none" s