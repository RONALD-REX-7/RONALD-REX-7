<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="126" viewBox="0 0 1200 126" role="img" aria-labelledby="title desc"><title id="title">The engineering loop</title><desc id="desc">Build, measure, debug and verify, represented by a moving oscilloscope waveform.</desc><defs><linearGradient id="bg"><stop stop-color="#151b3b"/><stop offset="1" stop-color="#1f2d57"/></linearGradient><linearGradient id="ln"><stop stop-color="#bbaaff"/><stop offset="1" stop-color="#6ddfff"/></linearGradient></defs><rect width="1200" height="126" rx="18" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="36" y="43" fill="#c8beff" font-size="12" font-weight="700" letter-spacing="2.3">THE ENGINEERING LOOP</text><text x="36" y="82" fill="#fff" font-size="26" font-weight="700">Build / Measure / Debug / Verify</text><text x="36" y="105" fill="#bcc9e8" font-size="11">Curiosity is the start. Evidence closes the loop.</text></g><g transform="translate(790 20)" fill="none" stroke="url(#ln)" stroke-width="2.5"><path d="M0 45H48L66 17L88 79L112 35L130 55H170L190 22L211 68L232 45H378" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dasharray" values="0 800;800 0;0 800" dur="7s" repeatCount="indefinite"/></path><path d="M0 84H378" stroke-opacity=".25"/><circle cx="232" cy="45" r="6" fill="#bfb1ff"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle></g></svg>