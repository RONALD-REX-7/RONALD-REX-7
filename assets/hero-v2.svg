<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="66" y="78" fill="#b8aaff" font-size="14" font-weight="700" letter-spacing="4">ENGINEERING PORTFOLIO  /  2026—28</text>
 <text x="62" y="151" fill="#ffffff" font-size="54" font-weight="750" letter-spacing="-1.6">RONALD REX C H</text>
 <rect x="66" y="176" width="68" height="4" rx="2" fill="url(#violet)"/>
 <text x="66" y="218" fill="#e5e3ff" font-size="23" font-weight="650">Embedded Systems  ·  Firmware  ·  Industrial IoT</text>
