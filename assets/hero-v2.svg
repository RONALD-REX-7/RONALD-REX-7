<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Ronald Rex C H — Embedded Systems and Industrial IoT</title><desc id="desc">A lavender and blue engineering identity banner with animated signal paths, a microcontroller illustration and embedded systems focus.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10152f"/><stop offset=".52" stop-color="#20204a"/><stop offset="1" stop-color="#101e3c"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8caff"/><stop offset=".48" stop-color="#9b8cff"/><stop offset="1" stop-color="#62d4ff"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#9d8bff" stop-opacity="0"/><stop offset=".5" stop-color="#b8a8ff"/><stop offset="1" stop-color="#64d7ff" stop-opacity="0"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8d7cff" stop-opacity=".34"/><stop offset="1" stop-color="#8d7cff" stop-opacity="0"/></radialGradient>
