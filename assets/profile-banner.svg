<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="50%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Cyan Trace Gradient -->
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="12" fill="url(#grid)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="299" rx="11.5" stroke="#30363d" stroke-width="1"/>

  <!-- Circuit Trace Artwork (Right Side) -->
  <g opacity="0.45" stroke="#388bfd" stroke-width="1.5" fill="none">
    <!-- Trace lines -->
    <path d="M 850 40 L 980 40 L 1020 80 L 1150 80" />
    <path d="M 900 80 L 950 80 L 990 120 L 1120 120" />
    <path d="M 820 140 L 920 140 L 960 180 L 1080 180 L 1120 220 L 1160 220" />
    <path d="M 880 200 L 940 200 L 970 230 L 1050 230" />
    <path d="M 840 260 L 990 260 L 1030 220 L 1110 220" />
    
    <!-- Vertical and Angled interconnects -->
    <path d="M 980 40 L 980 60" />
    <path d="M 1080 180 L 1080 150 L 1110 120" />
    <path d="M 920 140 L 920 100" />
  </g>

  <!-- Circuit Via / Nodes -->
  <g fill="#0d1117" stroke="#58a6ff" stroke-width="2">
    <circle cx="850" cy="40" r="4" fill="#58a6ff"/>
    <circle cx="1150" cy="80" r="4" fill="#58a6ff"/>
    <circle cx="900" cy="80" r="3.5"/>
    <circle cx="1120" cy="120" r="4" fill="#58a6ff"/>
    <circle cx="820" cy="140" r="4" fill="#388bfd"/>
    <circle cx="1160" cy="220" r="4" fill="#58a6ff"/>
    <circle cx="880" cy="200" r="3.5"/>
    <circle cx="1050" cy="230" r="4" fill="#388bfd"/>
    <circle cx="840" cy="260" r="4" fill="#58a6ff"/>
    <circle cx="920" cy="100" r="3"/>
  </g>

  <!-- Glowing Accent Lines (Left Edge) -->
  <rect x="0" y="40" width="4" height="220" rx="2" fill="url(#cyanGrad)"/>

  <!-- Main Profile Name -->
  <text x="60" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#f0f6fc" letter-spacing="0.5">
    RONALD REX C H
  </text>

  <!-- Degree & College Affiliation -->
  <text x="60" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" letter-spacing="0.8">
    B.E. ELECTRONICS &amp; COMMUNICATION ENGINEERING &#8226; ANNA UNIVERSITY (2024&#8211;2028)
  </text>

  <!-- Primary Engineering Disciplines -->
  <text x="60" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#c9d1d9">
    Embedded Systems &#8226; Microcontroller Firmware &#8226; Industrial IoT &#8226; Edge AI
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="175" x2="720" y2="175" stroke="#30363d" stroke-width="1.5" />

  <!-- Hardware & Technology Badges (Restrained Tech Tags) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Tag 1: Embedded Hardware -->
    <rect x="60" y="195" width="165" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="75" cy="209" r="4" fill="#238636"/>
    <text x="87" y="214" fill="#e6edf3">Arduino Nano &#8226; ESP32-S3</text>

    <!-- Tag 2: Firmware & C++ -->
    <rect x="235" y="195" width="160" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="250" cy="209" r="4" fill="#1f6feb"/>
    <text x="262" y="214" fill="#e6edf3">PlatformIO &#8226; Embedded C++</text>

    <!-- Tag 3: Sensor Protocols -->
    <rect x="405" y="195" width="155" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="420" cy="209" r="4" fill="#8957e5"/>
    <text x="432" y="214" fill="#e6edf3">I2C &#8226; SPI &#8226; UART &#8226; LoRa</text>

    <!-- Tag 4: Edge Intelligence -->
    <rect x="570" y="195" width="155" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="585" cy="209" r="4" fill="#d29922"/>
    <text x="597" y="214" fill="#e6edf3">TinyML &#8226; Sensor Fusion</text>
  </g>

  <!-- Secondary Footer Credibility Note -->
  <text x="60" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e">
    S.A. Engineering College, Chennai &#8226; Hardware Bench Tested Prototypes &#8226; Zero Fabricated Claims
  </text>
</svg>
