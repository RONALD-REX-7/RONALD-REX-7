<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d">
<title id="t">Edge Payload Guard</title><desc id="d">Telemetry payload flowing through a schema validation gate into trusted edge application processing.</desc>
