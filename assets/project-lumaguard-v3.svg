<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">LumaGuard</title><desc id="desc">Physical embedded prototype with ultrasonic sensor, ATmega328P controller and OLED display.</desc><defs><linearGradient id="bg"><stop stop-color="#141b3a"/><stop offset="1" stop-color="#202d56"/></linearGradient><linearGradient id="ln"><stop stop-color="#c2b3ff"/><stop offset="1" stop-color="#6ddfff"/></linearGradient></defs><rect width="1200" height="210" rx="20" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="36" y="38" fill="#c4b7ff" font-size="12" font-weight="700" letter-spacing="2">01 / PHYSICAL EMBEDDED PROTOTYPE</text><text x="36" y="88" fill="#fff" font-size="34" font-weight="750">LumaGuard</text><text x="38" y="119" fill="#d2d9f1" font-size="17">Sense proximity · confirm hazards · communicate system state</text><text x="38" y="165" fill="#9de4ff" font-size="13">ATmega328P · HC-SR04 · IR FLAME · SSD1306 · EEPROM</text></g><g transform="translate(700 35)" fill="none" stroke="url(#ln)" stroke-width="2.5" stroke-linejoin="round"><rect x="145" y="28" width="150" height="112" rx="13" fill="#1e2850"/><rect x="177" y="55" width="88" height="55" rx="6" fill="#101936"/><path d="M190 82H204L216 66L229 97L242 82H253"/><path d="M125 42H145M125 63H145M125 84H145M125 105H145M295 42H315M295 63H315M295 84H315M295 105H315"/><rect x="0" y="47" width="95" height="72" rx="12" fill="#22284e"/><circle cx="25" cy="83" r="8"/><circle cx="68" cy="83" r="8"/><path d="M22 69Q47 30 72 69M22 97Q47 136 72 97"/><rect x="370" y="43" width="90" height="80" rx="10" fill="#22284e"/><path d="M387 100V62H443V100Z"/><path d="M396 89H434M396 77H434M396 65H434"/><path d="M95 83H145M295 83H370"/><circle cx="95" cy="83" r="5" fill="#a99cff"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="370" cy="83" r="5" fill="#72ddff"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle></g><g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#bfcbea"><text x="700" y="29">ULTRASONIC</text><text x="850" y="29">MCU / CONTROL</text><text x="1090" y="29">DISPLAY</text></g></svg>