<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="t d">
<title id="t">Gesture controlled robotic arm</title><desc id="d">Isometric illustration of a wearable sensor glove sending wireless commands to a multi-joint robotic arm.</desc>
