<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32" fill="none">
  <defs>
    <linearGradient id="sepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="1"/>
      <stop offset="55%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Bus Line with Step -->
  <path d="M 50 16 L 360 16 L 390 10 L 420 10" stroke="url(#sepGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="360" cy="16" r="2.5" fill="#A78BFA"/>
  <circle cx="420" cy="10" r="2.5" fill="#7C3AED"/>

  <!-- Right Bus Line with Step -->
  <path d="M 850 16 L 540 16 L 510 22 L 480 22" stroke="url(#sepGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="540" cy="16" r="2.5" fill="#A78BFA"/>
  <circle cx="480" cy="22" r="2.5" fill="#7C3AED"/>

  <!-- Center Diamond Resonator Node -->
  <g transform="translate(450, 16)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#7C3AED"/>
  </g>
</svg>

